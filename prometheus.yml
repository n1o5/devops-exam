global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "order_service"
    static_configs:
      - targets: ["host.docker.internal:8000"]
  
  - job_name: "kubernetes_pods"
    static_configs:
      - targets: ["host.docker.internal:8001"]

rule_files:
  - /etc/prometheus/alert_rules.yml
